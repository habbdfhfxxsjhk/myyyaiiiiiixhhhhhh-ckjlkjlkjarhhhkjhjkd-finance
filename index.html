const $=id=>document.getElementById(id),fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),usd=n=>'$'+fmt(n),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},dateShift=(d,n)=>{let t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)},monthShift=(d,n)=>{let [y,m,day]=d.split('-').map(Number);let t=new Date(Date.UTC(y,m-1+n,1));let yy=t.getUTCFullYear(),mm=t.getUTCMonth()+1;let max=new Date(Date.UTC(yy,mm,0)).getUTCDate();return `${yy}-${String(mm).padStart(2,'0')}-${String(Math.min(day,max)).padStart(2,'0')}`},periodEnd=(start)=>monthShift(start,1),cycleIndex=d=>{let n=0,s=START;while(periodEnd(s)<=d&&n<240){s=periodEnd(s);n++}return n},cycleStart=d=>monthShift(START,cycleIndex(d)),cycleRange=d=>{let s=cycleStart(d);return [s,dateShift(periodEnd(s),-1)]},inRange=(d,a,b)=>d>=a&&d<=b,round=n=>Math.round((n+Number.EPSILON)*100)/100;

let html=`<div class="modalwrap" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${r?'تعديل':'إضافة'} ${type==='sale'?'المشتريات والمبيعات':type==='deposit'?'إيداع':type==='expense'?'مصروف':type==='debt'?'دين':type==='capital'?'حركة رأس مال':'دفعة شهرية'}</h2><button class="btn ghost" id="closeModal">✕ إغلاق</button></div><form id="entryForm"><div class="formgrid">${input('date','تاريخ العملية','date',r?.date||today())}${fields}<div class="field full"><label>ملاحظات / سبب العملية</label><textarea name="note" rows="2">${escapeHTML(r?.note||'')}</textarea></div></div><div class="toolbar" style="margin-top:16px"><button class="btn primary" type="submit">حفظ العملية</button><button class="btn ghost" type="button" id="cancelModal">إلغاء</button></div></form></div></div>`;$('modalHost').innerHTML=html;enhanceIcons();const close=()=>{$('modalHost').innerHTML=''};$('closeModal').onclick=close;$('cancelModal').onclick=close;$('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')close()};function extra(){if(type!=='deposit')return;let k=$('f_kind').value;let h='';if(['syriatel','chamsyp','mtn'].includes(k))h=input('amount','مبلغ الإيداع بالليرة','number',r?.amount??'')+input('rate1','سعر صرف الموقع (ليرة/دولار)','number',r?.rate1??'')+input('rate2','سعر شراء الدولار (ليرة/دولار)','number',r?.rate2??'');else if(k==='chamusd')h=input('amount','مبلغ الإيداع بالدولار','number',r?.amount??'')+input('rate1','نسبة عمولة الموقع %','number',r?.rate1??'')+input('rate2','نسبة العمولة المدفوعة %','number',r?.rate2??'');else if(k==='usdt')h=input('amount','إجمالي الإيداعات USDT','number',r?.amount??'')+input('count','عدد العمليات','number',r?.count??1)+input('actual','الربح الفعلي بالدولار (0 إن لم يوجد)','number',r?.actual??0);else h=input('amount','المبلغ الكامل','number',r?.amount??'')+input('deduct','المبلغ المخصوم','number',r?.deduct??0)+input('rate1','سعر الأخذ','number',r?.rate1?? $('entryForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:id||('r'+Date.now()+Math.random().toString(36).slice(2,8)),type,date:String(f.get('date')),note:String(f.get('note')||'')};if(!/^\d{4}-\d{2}-\d{2}$/.test(obj.date)||obj.date<START)return alert('التاريخ يجب أن يكون من بداية النظام 17/11/2026');for(const [k,v] of f.entries()){if(['date','note'].includes(k))continue;if(['cost','sale','amount','rate1','rate2','actual','deduct','count'].includes(k)){if(v===''||!Number.isFinite(Number(v))||Number(v)<0)return alert('تحقق من المبالغ والأسعار');obj[k]=Number(v)}else obj[k]=String(v)}if(obj.date>today())return alert('لا يمكن تسجيل عملية بتاريخ مستقبلي');if(type==='sale'&&(!Number.isFinite(obj.cost)||!Number.isFinite(obj.sale)))return alert('أدخل المشتريات والمبيعات');if(type==='deposit'&&['syriatel','chamsyp','mtn','external'].includes(obj.kind)&&(obj.rate1<=0||obj.rate2<=0))return alert('سعر الصرف يجب أن يكون أكبر من صفر');if(type==='deposit'&&obj.kind==='external'&&obj.deduct>obj.amount)return alert('الخصم أكبر من المبلغ');if(type==='sale'&&obj.order&&data.rows.some(x=>x.id!==id&&x.type==='sale'&&x.order===obj.order))return alert('رقم السجل مستخدم سابقاً');if(type==='debt'){obj.settled=r?.settled||0;obj.settlements=r?.settlements||[];if(obj.amount<obj.settled)return alert('أصل الدين أقل من المسدد')}if(type==='subscription'){obj.paid=obj.paid==='true';if(obj.paid){obj.date=obj.paidDate||obj.date}else obj.date=obj.due}let previous=JSON.stringify(data.rows);if(id){let i=data.rows.findIndex(x=>x.id===id);if(i<0)return;data.rows[i]=obj}else data.rows.push(obj);if(save()){close();render()}else data.rows=JSON.parse(previous)}}
function exportCSV(){let type=page==='daily'||page==='inventoryDaily'?'sale':page==='depositDaily'?'deposit':page==='expenses'?'expense':page==='subscriptions'?'subscription':page==='capitalMovements'?'capital':'debt';let rows=data.rows.filter(r=>r.type===type);let headers=['التاريخ','النوع','الوصف','المبلغ','الملاحظات'];let lines=[headers,...rows.map(r=>[r.date,r.type,rowName(r),r.type==='debt'?r.amount-(r.settled||0):amount(r),r.note||''])].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));download('maxcard-'+type+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function download(name,text,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setPage(b.dataset.nav));$('printTop').onclick=()=>window.print();$('exportTop').onclick=()=>download('maxcard-export-'+today()+'.json',JSON.stringify(data,null,2),'application/json');$('backupTop').onclick=()=>download('maxcard-backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json');$('importTop').onclick=()=>setPage('settings');$('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim().toLowerCase();if(!q)return;let rs=data.rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));setPage('siteReport');$('content').insertAdjacentHTML('afterbegin',`<section class="panel"><h2>نتائج البحث: ${escapeHTML(q)} (${rs.length})</h2>${tableRows(rs,false)}</section>`)}});$('headerDate').textContent=today();$('toggle').onclick=()=>$('sidebar').classList.toggle('closed');$('helpTop').onclick=()=>setPage('help');if(innerWidth<650)$('sidebar').classList.add('closed');renderNav();render();
</script><script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('تعذر تفعيل العمل دون إنترنت:',err)));}</script></body></html>
